<script>
const LOGO="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\"><rect width=\"64\" height=\"64\" fill=\"#030207\"/><path d=\"M14 56V28A18 18 0 0 1 50 28V56\" fill=\"none\" stroke=\"#a07bff\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M20 56V29A12 12 0 0 1 44 29V56\" fill=\"none\" stroke=\"#5cc8ff\" stroke-width=\"1.6\" opacity=\".6\"/><path d=\"M32 11V56\" stroke=\"#e6f5ff\" stroke-width=\"2.4\"/></svg>";
// State, save/load, dates, seeded random.
const $=id=>document.getElementById(id);
const def=()=>({v:SAVE_VERSION,xp:0,fl:0,chk:null,days:{},gates:{},hist:{},keys:[],stars:[],win:{s:"17:00",e:"19:00"}});
let S; // loaded at boot (main.js) once every module is defined
const SAVE_KEY=window.__SAVEKEY||"gate1"; // the dev build uses its own key so it never touches a real save
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}};
const ds=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const now=()=>new Date(Date.now()+((S.off||0)*864e5)); // S.off only exists in automated tests (time travel)
const today=()=>ds(now());const nowMs=()=>now().getTime();
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h};
function rnd(seed){let a=hash(seed);return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function weekId(d=now()){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return ds(x)}
// Save format, migrations, validation. A bad import or corrupt save never replaces a good one.
// v1 = original build. v2 = adds the rank floor (fl). v3 = adds weekly summary records (hist). v4 = adds special keys, pending penalty choice. v5 = adds prestige stars. v6 = adds medical pause (pause, days.med). Add one MIGRATIONS step per version bump,
// and add every new state field to sanitize() or it is dropped on load/import.
const SAVE_VERSION=6;
const MIGRATIONS={1:o=>({...o,fl:0,v:2}),2:o=>({...o,hist:{},v:3}),3:o=>({...o,keys:[],v:4}),4:o=>({...o,stars:[],v:5}),5:o=>({...o,v:6})};
const DATE=/^\d{4}-\d\d-\d\d$/,HM=/^([01]\d|2[0-3]):[0-5]\d$/;
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const num=(x,lo,hi,d)=>typeof x==="number"&&isFinite(x)?Math.min(hi,Math.max(lo,x)):d;
const int=(x,lo,hi,d)=>Number.isInteger(x)&&x>=lo&&x<=hi?x:d;
function cleanGate(g){
  if(!isObj(g))return null;
  const o={p:int(g.p,0,3,0),kr:int(g.kr,0,6,0),start:g.start==null?null:num(g.start,0,1e15,null),prog:num(g.prog,0,1e6,0),done:g.done===true,coop:g.coop===true,paid:g.paid===true};
  if(g.pp!=null)o.pp=num(g.pp,0,9999,0);if(g.end!=null)o.end=num(g.end,0,1e15,undefined);if(g.bx!=null)o.bx=num(g.bx,0,1e6,undefined);
  return o;
}
function sanitize(o){
  const s=def();s.xp=num(o.xp,0,1e7,0);s.fl=int(o.fl,0,5,0);s.chk=DATE.test(o.chk)?o.chk:null;
  if(isObj(o.days))for(const k of Object.keys(o.days)){const e=o.days[k];if(DATE.test(k)&&isObj(e)){const d={};
    if(e.p!=null)d.p=int(e.p,0,2,undefined);if(e.p2!=null)d.p2=int(e.p2,0,2,undefined);for(const f of["done","hb","h","rest","sg","c2","done2","med"])if(e[f]===true)d[f]=true;s.days[k]=d}}
  if(isObj(o.gates))for(const k of Object.keys(o.gates)){const g=cleanGate(o.gates[k]);if(DATE.test(k)&&g)s.gates[k]=g}
  const c=cleanGate(o.co);if(c&&DATE.test(o.co.w)){c.w=o.co.w;s.co=c}
  if(isObj(o.win)){if(HM.test(o.win.s))s.win.s=o.win.s;if(HM.test(o.win.e))s.win.e=o.win.e;s.win.len=int(o.win.len,1,2,2)}
  if(isObj(o.hist))for(const k of Object.keys(o.hist)){const r=o.hist[k];if(DATE.test(k)&&isObj(r))s.hist[k]={c:int(r.c,0,7,0),xp:num(r.xp,0,1e7,0),xl:num(r.xl,0,1e7,0),v:num(r.v,0,1e7,0),st:int(r.st,0,1e5,0),g:int(r.g,0,2,0),bp:[0,1,2,3].map(i=>int(Array.isArray(r.bp)?r.bp[i]:0,0,1e4,0))}}
  if(isObj(o.pend)&&typeof o.pend.n==='number'&&isFinite(o.pend.n))s.pend={n:num(o.pend.n,0,1e4,0),m:int(o.pend.m,1,1e4,1)};
  if(Array.isArray(o.keys))for(const k of o.keys.slice(0,20)){if(isObj(k)){const r=int(k.r,0,6,-1),sd=int(k.s,0,36**6-1,-1);if(r>=0&&sd>=0&&!s.keys.some(x=>x.r===r&&x.s===sd))s.keys.push({id:keyCode({r,s:sd}),r,s:sd})}}
  if(isObj(o.sg)){const g=o.sg,r=int(g.r,0,6,-1),sd=int(g.s,0,36**6-1,-1);
    if(r>=0&&sd>=0&&Array.isArray(g.ex)&&g.ex.length===3&&g.ex.every(x=>EX[x])&&Array.isArray(g.t)&&Array.isArray(g.p))
      s.sg={id:keyCode({r,s:sd}),r,s:sd,start:num(g.start,0,1e15,0),end:num(g.end,0,1e15,0),ex:g.ex.slice(),t:[0,1,2].map(i=>int(g.t[i],1,9999,1)),p:[0,1,2].map(i=>int(g.p[i],0,9999,0)),run:g.run===true,done:g.done===true,bx:num(g.bx,0,1e6,0)}}
  if(Array.isArray(o.stars))s.stars=o.stars.slice(0,99).filter(isObj).map(x=>({plus:x.plus===true}));
  if(isObj(o.pause)&&typeof o.pause.t==='number')s.pause={t:num(o.pause.t,0,1e15,0)};
  s.tok=int(o.tok,0,2,0);s.att=int(o.att,0,3,0);
  if(o.rem===0||o.rem===1)s.rem=o.rem;
  for(const f of["plus","sec","tut"])if(o[f]===true)s[f]=true;
  if(typeof o.jm==="string")s.jm=o.jm.slice(0,200);
  return s;
}
// Text -> clean current-version state, or throws Error with a short reason.
function parseSave(text){
  let o;try{o=JSON.parse(text)}catch(e){throw new Error("Not valid data")}
  if(!isObj(o))throw new Error("Not a save");
  if(typeof o.xp!=="number"||!isFinite(o.xp)||o.xp<0)throw new Error("No valid XP");
  let v=o.v===undefined?1:o.v;
  if(!Number.isInteger(v)||v<1)throw new Error("Unknown version");
  if(v>SAVE_VERSION)throw new Error("Save is from a newer version");
  while(v<SAVE_VERSION){o=MIGRATIONS[v](o);v=o.v}
  return sanitize(o);
}
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
// Keep the current save under a side key before anything replaces it.
const keepPrev=()=>{const c=store.get(SAVE_KEY);if(c)store.set(SAVE_KEY+".prev",c)};
let loadNote=null;
function loadSave(){
  const raw=store.get(SAVE_KEY);if(!raw)return def();
  try{
    const o=parseSave(raw),v=(JSON.parse(raw).v||1);
    if(v<SAVE_VERSION&&store.get(SAVE_KEY+".v"+v)===null)store.set(SAVE_KEY+".v"+v,raw); // pre-migration copy
    return o;
  }catch(e){store.set(SAVE_KEY+".bad",raw);loadNote="Saved data could not be read. A copy was kept. Starting fresh.";return def()}
}
// Export / import of the save.
function expJ(){$("jx").value=JSON.stringify(S);$("jx").select();try{navigator.clipboard.writeText($("jx").value)}catch(e){}toast("Data copied.")}
function impJ(){try{const n=parseSave($("jx").value);keepPrev();S=n;raiseFloor();save();render();toast("Data imported.")}catch(e){toast("Import failed: "+(e.message||"invalid data")+". Current progress kept.")}}
// XP, ranks, missed-day penalty.
const R=["EE","E","D","C","B","A","S"],T=[0,30,100,250,600,1400,3000];
const ri=()=>{let r=0;T.forEach((t,i)=>{if(S.xp>=t)r=i});return r};
const scale=()=>1+ri()*.4;
// Rank floors: a reached rank is a floor. Only S can fall, and only to A (index 5).
const floorIdx=()=>Math.min(5,Math.max(S.fl||0,0));
function raiseFloor(){const f=Math.min(5,ri());if(f>(S.fl||0))S.fl=f}
// Remove XP without dropping below the floor. Returns the XP actually lost.
function loseXp(n){const min=T[floorIdx()],l=Math.max(0,Math.min(n,S.xp-min));S.xp-=l;return l}
function penalty(){
  sgExpire();raiseFloor();pauseMark();const t=today();if(!S.chk){S.chk=t;save();return}

// Draw one frame. Joints: 0 head, 1 neck, 2 pelvis, 3 elbow, 4 wrist, 5 knee, 6 foot, 7 knee2, 8 foot2.
function figSvg(f,mirror){
  const P=[];for(let i=0;i<f.length;i+=2)P.push([f[i],f[i+1]]);
  const q=a=>a[0]+" "+a[1],mx=a=>[2*P[2][0]-a[0],a[1]];
  let d="M"+q(P[1])+"L"+q(P[2])+"M"+q(P[1])+"L"+q(P[3])+"L"+q(P[4])+"M"+q(P[2])+"L"+q(P[5])+"L"+q(P[6]);
  if(P[7])d+="M"+q(P[2])+"L"+q(P[7])+"L"+q(P[8]);
  if(mirror)d+="M"+q(P[1])+"L"+q(mx(P[3]))+"L"+q(mx(P[4]))+"M"+q(P[2])+"L"+q(mx(P[5]))+"L"+q(mx(P[6]));
  return `<svg viewBox="0 0 80 60" role="img" aria-label="Movement frame"><path d="M2 56H78" class="fl"/><path d="${d}" class="ln"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="4" class="hd"/></svg>`;
}

function resetTap(b){if(b.dataset.c){keepPrev();S=def();save();render();toast("Progress reset.")}else{b.dataset.c="1";b.textContent="Tap again to confirm reset";setTimeout(()=>{b.dataset.c="";b.textContent="Reset progress"},4000)}}
// Setup tab helpers: daily window, reminder, test tools.
function ics(){
  const[s]=S.win.s.split(":").map(Number),m=+S.win.s.split(":")[1];let t=s*60+m-30;if(t<0)t+=1440;
  const hh=String(Math.floor(t/60)).padStart(2,"0"),mm=String(t%60).padStart(2,"0");
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//gate//EN","BEGIN:VEVENT","UID:gate-daily@local","DTSTART:20260101T"+hh+mm+"00","DURATION:PT30M","RRULE:FREQ=DAILY","SUMMARY:The gate opens in 30 minutes","DESCRIPTION:Your daily quest is waiting. The window is "+S.win.s+" to "+endT()+".","BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:The gate opens soon","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function remind(v){S.rem=v;if(v){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics()],{type:"text/calendar"}));a.download="reminder.ics";a.click()}catch(e){}}save();render()}
function endT(){const[h,m]=S.win.s.split(":").map(Number),t=(h*60+m+60*(S.win.len||2))%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function setHM(h12,m,pm){const h=h12%12+(pm?12:0);S.win.s=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");save();render()}
function setH(v){const[h,m]=S.win.s.split(":").map(Number);setHM(+v,m,h>=12)}
function setM(v){const[h]=S.win.s.split(":").map(Number);setHM(h%12||12,+v,h>=12)}
function setP(v){const[h,m]=S.win.s.split(":").map(Number);setHM(h%12||12,m,+v==1)}
function setLen(n){S.win.len=n;save();render()}
function tp2(){const[h,m]=S.win.s.split(":").map(Number),h12=h%12||12;const sel=(opts,cur,fn)=>`<select class="sl" onchange="${fn}(this.value)">${opts.map(o=>`<option value="${o[0]}" ${o[0]==cur?"selected":""}>${o[1]}</option>`).join("")}</select>`;return `<div class="tp"><div class="mu">Opens at <b style="color:#fff;font-size:18px">${S.win.s}</b></div><div class="row" style="justify-content:flex-start;margin-top:6px">${sel([...Array(12).keys()].map(i=>[i+1,i+1]),h12,"setH")}${sel([...Array(12).keys()].map(i=>[i*5,String(i*5).padStart(2,"0")]),m,"setM")}${sel([[0,"AM"],[1,"PM"]],h>=12?1:0,"setP")}</div></div>`}
